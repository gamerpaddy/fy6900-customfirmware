; PlatformIO Project Configuration File for FY6900 Firmware
; STM32F103CB with SWD upload and COM14 UART debug

[env:genericSTM32F103CB]
platform = ststm32
board = genericSTM32F103CB
framework = arduino

; Upload configuration - SWD protocol
upload_protocol = stlink
debug_tool = stlink

; Serial monitor configuration - COM14 for debug UART
monitor_port = COM14
monitor_speed = 9600
monitor_filters = 
    colorize
    time

; Build flags for STM32F103CB
build_flags =
    -Og 
    -g3
; Library dependencies
lib_deps = 
    adafruit/Adafruit Keypad@^1.2.4
    bodmer/TFT_eSPI@^2.5.43
    madleech/Button@^1.0.0

; Additional build options
board_build.core = stm32
board_build.variant = STM32F1xx/F103C8T_F103CB(T-U)
board_build.ldscript = ldscript.ld

; Debug configuration
debug_init_break = tbreak setup
debug_load_mode = manual

; Upload settings
upload_flags = 
    -c
    set CPUTAPID 0x1ba01477
    -DUSER_SETUP_LOADED=1    ; use platformio.ini for TFT_eSPI custom config

    ; Defines for TFT_eSPI
    -DILI9341_DRIVER=1       ; Generic driver for common displays
    ;-DSTM32=1                ; STM32 optimizations ... not working?
    -DTFT_RGB_ORDER=TFT_BGR  ; Colour order Red-Green-Blue
    -DCGRAM_OFFSET=1
    -DTFT_WIDTH=240          ; ST7789 240 x 240 and 240 x 320
    -DTFT_HEIGHT=280         ; ST7789 240 x 320
    -DTFT_BL=PA11            ; LED back-light control pin
    -DTFT_BACKLIGHT_ON=HIGH  ; Level to turn ON back-light (HIGH or LOW)

    -DTFT_MOSI=PA7
    -DTFT_SCLK=PA5
    -DTFT_CS=PA4
    -DTFT_DC=PB10
    -DTFT_RST=PC13

    -DLOAD_GLCD=1    ; Font 1. Original Adafruit 8 pixel font needs ~1820 bytes in FLASH
    -DLOAD_FONT2=1   ; Font 2. Small 16 pixel high font, needs ~3534 bytes in FLASH, 96 characters
    -DLOAD_FONT4=1   ; Font 4. Medium 26 pixel high font, needs ~5848 bytes in FLASH, 96 characters
    -DLOAD_FONT6=1   ; Font 6. Large 48 pixel font, needs ~2666 bytes in FLASH, only characters 1234567890:-.apm
    -DLOAD_FONT7=1   ; Font 7. 7 segment 48 pixel font, needs ~2438 bytes in FLASH, only characters 1234567890:-.
    -DLOAD_FONT8=1   ; Font 8. Large 75 pixel font needs ~3256 bytes in FLASH, only characters 1234567890:-.
    ;-DLOAD_FONT8N=1  ; Font 8. Alternative to Font 8 above, slightly narrower, so 3 digits fit a 160 pixel TFT
    -DLOAD_GFXFF=1   ; FreeFonts. Include access to the 48 Adafruit_GFX free fonts FF1 to FF48 and custom fonts
; Comment out SMOOTH_FONT to stop the SPIFFS filing system and smooth font code being loaded
; this will save ~20kbytes of FLASH
    ;-DSMOOTH_FONT
    -DSPI_FREQUENCY=80000000

; Board specific settings
board_build.mcu = stm32f103cbt6
board_build.f_cpu = 72000000L
board_upload.maximum_size = 65536
board_upload.maximum_ram_size = 20480

